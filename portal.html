<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMOI E-learning Portal (model)</title>
<meta name="robots" content="noindex, nofollow">
<style>.proto a.plink{text-decoration:none}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* IMOI e-learning portal prototype v3: one responsive layout for phone, tablet and laptop. */
:root{--bg:#f3f7f8;--surface:#ffffff;--soft:#edf4f5;--ink:#0b3949;--text:#31454a;--muted:#56686d;--line:#d9e4e7;--teal:#12474f;--teal2:#1f7a8c;--aqua:#27a7b5;--gold:#f2b33d;--gold2:#ffd77a;--gold-ink:#2f2100;--ok:#0b6b52;--ok-bg:#dcf4ec;--warn:#6f4b00;--warn-bg:#fff0cc;--bad:#a33a22;--bad-bg:#fde6df;--note:#efe9ff;--note-ink:#3a2c6b;--glow:rgba(31,122,140,.25);--shadow:0 8px 26px rgba(11,57,73,.09);--shadow2:0 18px 44px rgba(11,57,73,.16);--hero1:#0b3138;--hero2:#16606e;--hero3:#17707e;--btn1:#0b3949;--btn2:#1a6f7f;--hdr:rgba(255,255,255,.92);--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081417;--surface:#10232a;--soft:#152d34;--ink:#e6f3f5;--text:#c3d5d9;--muted:#93abb0;--line:#24404a;--teal:#1b6d7d;--teal2:#2b96aa;--aqua:#3cc6d4;--gold:#f5bd4f;--gold2:#ffd98a;--gold-ink:#2a1d00;--ok:#86e3c4;--ok-bg:#123a30;--warn:#ffd47a;--warn-bg:#3a2f12;--bad:#ffb4a1;--bad-bg:#3e2019;--note:#2b2550;--note-ink:#dcd4ff;--glow:rgba(60,198,212,.22);--shadow:0 10px 30px rgba(0,0,0,.4);--shadow2:0 18px 44px rgba(0,0,0,.5);--hero1:#06232a;--hero2:#124f5b;--hero3:#135f6b;--btn1:#145a66;--btn2:#1a7584;--hdr:rgba(16,35,42,.92);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#081417;--surface:#10232a;--soft:#152d34;--ink:#e6f3f5;--text:#c3d5d9;--muted:#93abb0;--line:#24404a;--teal:#1b6d7d;--teal2:#2b96aa;--aqua:#3cc6d4;--gold:#f5bd4f;--gold2:#ffd98a;--gold-ink:#2a1d00;--ok:#86e3c4;--ok-bg:#123a30;--warn:#ffd47a;--warn-bg:#3a2f12;--bad:#ffb4a1;--bad-bg:#3e2019;--note:#2b2550;--note-ink:#dcd4ff;--glow:rgba(60,198,212,.22);--shadow:0 10px 30px rgba(0,0,0,.4);--shadow2:0 18px 44px rgba(0,0,0,.5);--hero1:#06232a;--hero2:#124f5b;--hero3:#135f6b;--btn1:#145a66;--btn2:#1a7584;--hdr:rgba(16,35,42,.92);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-img{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo-img{filter:brightness(0) invert(1)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;transition:background-color .3s,color .3s;overflow-x:hidden}
@media (min-width:1024px){body{font-size:16px}}
h1,h2,h3{color:var(--ink);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal2)}
img{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.i{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.wrap{padding-left:24px;padding-right:24px}}
@media (min-width:1024px){.wrap{padding-left:32px;padding-right:32px}}

/* Prototype strip and guide drawer (not part of the real portal) */
.proto{background:var(--note);color:var(--note-ink);font-size:12.5px}
.proto .wrap{display:flex;align-items:center;gap:10px;min-height:40px;flex-wrap:wrap;padding-top:4px;padding-bottom:4px}
.ptag{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px;background:var(--note-ink);color:var(--note);padding:3px 8px;border-radius:6px}
.ptxt{display:none}
@media (min-width:1024px){.ptxt{display:inline}}
.plink{border:0;background:none;color:var(--note-ink);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:6px 4px;min-height:34px}
.plink svg.i{width:17px;height:17px}
.proto .seg{margin-left:auto}
.drawer-bg{position:fixed;inset:0;background:rgba(5,20,23,.5);z-index:70;animation:fade .2s ease}
.drawer{position:fixed;z-index:71;background:var(--surface);color:var(--text);box-shadow:var(--shadow2);overflow:auto;display:flex;flex-direction:column;gap:14px;padding:20px;left:0;right:0;bottom:0;max-height:88vh;border-radius:22px 22px 0 0;animation:sheet .3s cubic-bezier(.2,.9,.3,1)}
@media (min-width:700px){.drawer{left:auto;top:0;bottom:0;width:420px;max-height:none;border-radius:0;animation:slidein .3s cubic-bezier(.2,.9,.3,1)}}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes slidein{from{transform:translateX(100%)}}
.drawer h2{font-size:19px}
.drawer ol{margin:0;padding-left:20px;display:grid;gap:7px;font-size:14px}
.drawer .dlinks{display:grid;gap:8px}
.drawer .dlinks a{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;font-weight:700;color:var(--ink);background:var(--soft)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Header */
.hdr{position:sticky;top:0;z-index:40;background:var(--hdr);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:12px;min-height:62px}
@media (min-width:1024px){.hdr-row{min-height:70px;gap:20px}}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 0;cursor:pointer;flex-shrink:0;color:var(--ink)}
.brand .full{height:38px;width:auto;display:none}
.brand .mark{height:30px;width:auto;display:block}
.brand .sep{display:none;width:1px;height:28px;background:var(--line)}
.brand .bt{font-weight:800;font-size:15px;color:var(--ink);white-space:nowrap}
@media (min-width:700px){.brand .full{display:block}.brand .mark{display:none}.brand .sep{display:block}.brand .bt{font-size:14px;color:var(--teal2)}}
@media (min-width:1024px){.brand .full{height:50px}}
.m-only{display:inline}
@media (min-width:700px){.m-only{display:none}}
.topnav{display:none;align-items:center;gap:2px}
@media (min-width:1024px){.topnav{display:flex}}
.topnav button,.subrow button{border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--text);cursor:pointer;white-space:nowrap;min-height:40px;transition:background .2s,color .2s}
.topnav button:hover,.subrow button:hover{background:var(--soft)}
.topnav button.on,.subrow button.on{color:var(--teal2);background:var(--soft)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.subnav{display:none;border-top:1px solid var(--line)}
.subrow{display:flex;gap:4px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
@media (min-width:700px) and (max-width:1023px){.subnav{display:block}}
@media (max-width:1023px){.hdr.adm .subnav{display:block}}
.acct{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font-weight:700;color:var(--ink);font-size:14px;min-height:42px}
.acct:hover{border-color:var(--teal2)}
@media (min-width:700px){.acct{display:flex}}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;font-weight:800;font-size:13px;flex:0 0 auto}
.avatar svg.i{width:18px;height:18px}
.avatar.big{width:64px;height:64px;font-size:22px}
.admtag{font-weight:800;font-size:13px;color:var(--note-ink);background:var(--note);padding:6px 12px;border-radius:999px}
.theme{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .3s;flex:0 0 auto}
.theme:hover{transform:rotate(-18deg) scale(1.06)}

/* Bottom menu on phones */
.bnav{position:sticky;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--hdr);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.bnav{display:none}}
.bnav button{position:relative;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bnav button.on{color:var(--teal2);font-weight:800}
.bnav button.on:before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--teal2),var(--aqua));animation:ind .35s ease}

/* Page */
.main{padding:18px 0 36px;min-height:60vh}
@media (min-width:1024px){.main{padding:28px 0 56px}}
.main .wrap{display:flex;flex-direction:column;gap:18px}
@media (min-width:1024px){.main .wrap{gap:24px}}
.main .wrap>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.main .wrap>*:nth-child(2){animation-delay:.04s}.main .wrap>*:nth-child(3){animation-delay:.08s}.main .wrap>*:nth-child(4){animation-delay:.12s}.main .wrap>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ind{from{transform:scaleX(0)}}
@keyframes fade{from{opacity:0}}
.phead{display:flex;flex-direction:column;gap:4px}
.phead .ph-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead h1{font-size:24px}
@media (min-width:1024px){.phead h1{font-size:30px}}
.phead p{color:var(--muted)}
.back{align-self:flex-start;border:0;background:none;color:var(--teal2);font-weight:700;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;min-height:36px}
.back svg.i{width:18px;height:18px}
.narrow{width:100%;max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
@media (min-width:700px){.card{padding:20px}}
.card h3{font-size:17px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sech h3{font-size:19px}
@media (min-width:1024px){.sech h3{font-size:22px}}
.small{font-size:13px;color:var(--muted)}
.lbl{font-weight:800;color:var(--ink);margin-bottom:8px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);margin:0 0 8px;position:relative}
.hidden{display:none!important}

/* Buttons and inputs */
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;text-align:center;min-height:50px;text-decoration:none;transition:transform .15s,box-shadow .25s,background-position .5s,filter .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.inline{display:inline-flex;width:auto;padding:10px 16px;font-size:14.5px;min-height:44px}
.b-main{color:#fff;background:linear-gradient(120deg,var(--btn1),var(--btn2),var(--btn1));background-size:220% 100%;box-shadow:0 8px 20px var(--glow)}
.b-main:hover{background-position:100% 0}
.b-gold{color:var(--gold-ink);background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 8px 20px rgba(242,179,61,.32)}
.b-line{color:var(--teal2);background:var(--surface);border:1.5px solid var(--teal2)}
.b-ghost{color:#fff;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.5)}
.b-bad{color:var(--bad);background:var(--surface);border:1.5px solid var(--bad)}
.linkbtn{border:0;background:none;color:var(--teal2);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.45);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.opt{font-weight:500;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:48px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal2);box-shadow:0 0 0 4px var(--glow)}
input[readonly]{background:var(--soft);color:var(--muted)}
textarea{min-height:96px;resize:vertical}
input[type=checkbox]{accent-color:var(--btn2);width:20px;height:20px;flex:0 0 auto}
.field{display:flex;flex-direction:column}
.fgrid{display:grid;gap:12px}
@media (min-width:700px){.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid .span2{grid-column:1/-1}}
.toggle{display:flex;align-items:flex-start;gap:10px;font-weight:600;color:var(--ink);margin:0;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);flex:0 0 auto}
.seg button{border:0;background:none;color:var(--ink);padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff}
.seg.sm button{min-height:32px;padding:5px 11px;font-size:12.5px}
.seg.wide{display:flex}
.seg.wide button{flex:1;justify-content:center;min-height:48px;font-size:14.5px}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:18px;flex:0 0 auto}
.icon:hover{border-color:var(--teal2)}
.icon svg.i{width:18px;height:18px}

/* Pills, chips, search */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.4;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--ok-bg)}.p-warn{color:var(--warn);background:var(--warn-bg)}.p-bad{color:#fff;background:linear-gradient(135deg,#b3261e,#b8470b)}.p-note{color:var(--note-ink);background:var(--note)}.p-plain{color:var(--text);background:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:40px;transition:all .2s}
.chip:hover{border-color:var(--teal2)}
.chip.on{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;border-color:transparent;box-shadow:0 4px 12px var(--glow)}
.chip svg.i{width:15px;height:15px;fill:currentColor}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 16px;min-height:54px;margin:0;font-weight:500;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--teal2);box-shadow:0 0 0 4px var(--glow)}
.search input[type=text]{flex:1;border:0;border-radius:0;background:none;padding:0;min-height:52px;font-size:16px}
.search input[type=text]:focus{box-shadow:none}

/* Hero bands */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px 20px;color:#fff;background:linear-gradient(120deg,var(--hero1),var(--teal),var(--hero2),var(--hero3));background-size:220% 220%;animation:shift 12s ease var(--sd,0s) infinite,rise .45s both}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,122,.32),transparent 70%);pointer-events:none}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero h1,.hero h2{color:#fff;font-size:26px;margin-bottom:10px;position:relative}
.hero p{color:#e2f0f2;position:relative;max-width:620px}
@media (min-width:700px){.hero{padding:34px 36px}.hero h1,.hero h2{font-size:32px}}
@media (min-width:1024px){.hero{padding:44px 48px}.hero h1,.hero h2{font-size:40px}.hero p{font-size:17px}}
.hero.split{display:grid;gap:10px}
@media (min-width:700px){.hero.split{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);align-items:end;padding-bottom:0}.hero.split .txt{padding-bottom:34px}}
@media (min-width:1024px){.hero.split .txt{padding-bottom:44px}}
.hero .art{display:none;position:relative}
@media (min-width:700px){.hero .art{display:block}.hero .art img{display:block;width:100%;max-width:400px;height:auto;margin-left:auto}}
.hp{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative}
.hp span{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff}
.hcta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;position:relative}
.band{display:grid;gap:14px;align-items:center;border-radius:22px;padding:22px;background:linear-gradient(135deg,var(--soft),var(--surface));border:1px solid var(--line)}
@media (min-width:700px){.band{grid-template-columns:minmax(0,1fr) auto;padding:26px 30px}}
.band .eyebrow{color:var(--teal2)}
.band h3{font-size:21px;margin-bottom:6px}

/* Course cards */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.ccard{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.ccard:hover{transform:translateY(-4px);box-shadow:var(--shadow2)}
.ccard .open{display:flex;flex-direction:column;flex:1;border:0;background:none;padding:0;margin:0;text-align:left;color:var(--text);cursor:pointer;width:100%}
.ccard .thumb{height:auto;aspect-ratio:16/10;border-radius:0;width:100%;flex:0 0 auto}
.ccard .cb{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}
.ccard .pricerow{margin-top:auto;padding-top:4px}
.ccard .heart{position:absolute;top:10px;right:10px}
.ccard .cact{padding:0 16px 16px}
@media (max-width:699px){
 .cards.rowish{grid-template-columns:1fr;gap:12px}
 .cards.rowish .ccard .open{flex-direction:row;align-items:stretch}
 .cards.rowish .ccard .thumb{width:104px;height:auto;min-height:112px;flex:0 0 104px;aspect-ratio:auto}
 .cards.rowish .ccard .cb{padding:12px 48px 12px 14px}
 .cards.rowish .ccard .heart{top:8px;right:8px;width:36px;height:36px}
}
.feat{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px}
.feat .ccard{flex:0 0 80%;scroll-snap-align:start}
@media (min-width:700px){.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}.feat .ccard{flex:none}}
@media (min-width:1024px){.feat{grid-template-columns:repeat(4,minmax(0,1fr))}}
.thumb{position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;text-align:center;border-radius:14px}
.thumb svg.i{width:34px;height:34px;stroke-width:1.7;opacity:.95}
.thumb .lbl{position:absolute;left:10px;bottom:8px;font-size:11px;letter-spacing:.08em;margin:0;color:#fff;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.6)}

.t-rules{background:linear-gradient(135deg,#0f4f57,#2a9d8f)}.t-safety{background:linear-gradient(135deg,#a3401f,#f08a45)}.t-deck{background:linear-gradient(135deg,#1d3557,#4f8fbf)}.t-mgmt{background:linear-gradient(135deg,#0b3138,#1f8a9c)}.t-assess{background:linear-gradient(135deg,#6b520f,#e0b232)}
.heart{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14);transition:transform .2s;z-index:1}

.cname{font-weight:800;color:var(--ink);font-size:15.5px;line-height:1.3}

/* Course page */
.chero{border-radius:24px;padding:24px 20px;color:#fff;background:linear-gradient(120deg,var(--hero1),var(--hero2));position:relative;overflow:hidden}

@media (min-width:1024px){.chero{padding:40px 44px}}

@media (min-width:1024px){.chero h1{font-size:36px;max-width:760px}}
.chero p.cdesc{color:#e2f0f2;margin-top:10px;max-width:720px;position:relative}
.cl{display:grid;gap:18px}
@media (min-width:1024px){.cl{grid-template-columns:minmax(0,1fr) 370px;align-items:start;gap:28px}.cl .side{grid-column:2;grid-row:1;position:sticky;top:90px}.cl .mainc{grid-column:1;grid-row:1}}
.mainc{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:700px){.mainc .cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.buybox{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--teal),var(--aqua) 55%,var(--gold)) border-box;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:relative}

.bbody{display:flex;flex-direction:column;gap:12px}

ul.mini{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
ul.mini li{display:flex;gap:8px;align-items:flex-start}

ul.ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:700px){ul.ticks.two{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}}
ul.ticks li{padding-left:28px;position:relative}
ul.ticks li:before{content:"\2713";position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--teal2),var(--aqua));color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
details.mod{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}

.sticky{position:sticky;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;margin:0 -16px;background:var(--hdr);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -8px 20px rgba(0,0,0,.08);animation:up .4s .2s both}

/* Checkout */
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;counter-reset:st}

.steps li.on{color:var(--ink)}
.steps li.on:before{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;border-color:transparent}
.steps li.done:before{content:"\2713";background:var(--ok-bg);color:var(--ok);border-color:transparent}
.co{display:grid;gap:16px}
@media (min-width:1024px){.co{grid-template-columns:minmax(0,1fr) 380px;align-items:start;gap:24px}.co .sumc{position:sticky;top:90px}}
.coform{display:flex;flex-direction:column;gap:16px;min-width:0}

.line:last-of-type{border-bottom:0}
.line .lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.line .lc{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (min-width:700px){.line{grid-template-columns:48px minmax(0,1fr) auto}.line .lc{grid-column:auto;justify-content:flex-end}}
.stepper{display:inline-flex;align-items:center;gap:6px}

.addline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addline select{flex:1 1 220px;width:auto;min-width:0;max-width:100%}
.sum div.r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}
.sum div.r span:first-child{min-width:0}
.sum .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:800;color:var(--ink);font-size:19px}
.sumc{display:flex;flex-direction:column;gap:12px}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);text-align:center}
.secure svg.i{width:15px;height:15px}

/* Learning, player, certificates */
.lcard{display:flex;flex-direction:column;gap:12px}
.lcard .top{display:flex;gap:12px;align-items:center;min-width:0}
.lgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

.bar-p{display:block;height:8px;border-radius:999px;background:var(--soft);overflow:hidden}

.pl{display:grid;gap:16px}

.stage{border-radius:18px;background:radial-gradient(circle at 70% 20%,#1d5560,#0b2328);color:#d5e8eb;aspect-ratio:16/9;display:grid;place-items:center;text-align:center;padding:18px;font-size:14px}
@media (min-width:1024px){.stage{font-size:16px}}

.curr .les{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}

.cert>div{background:var(--surface);border-radius:14px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:6px}

.cert h3{font-size:19px;margin:0}
.cert .who{font-weight:800;color:var(--ink);font-size:20px}
.cert .cfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;text-align:left;margin-top:8px}
.qr{width:70px;height:70px;border:2px solid var(--ink);border-radius:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px;flex:0 0 auto}
.qr i{background:var(--ink)}.qr i.o{background:transparent}
.cbtns{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px}

/* Account, team, company */
.acc{display:grid;gap:16px}
@media (min-width:1024px){.acc{grid-template-columns:360px minmax(0,1fr);align-items:start;gap:24px}}
.accl,.accr{display:flex;flex-direction:column;gap:16px;min-width:0}

.prof h2{font-size:20px}
dl.kv{margin:0;display:grid;gap:10px}

.pay{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}

/* Tables */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

.tablebox table input,.tablebox table select{min-height:40px;padding:6px 8px;min-width:84px}
.tablebox table input[type=checkbox]{min-width:0;min-height:0;width:22px;height:22px;padding:0}

/* Messages, modal, confetti, tech notes */
.toast{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;animation:slide .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slide{from{opacity:0;transform:translateY(-10px) scale(.98)}}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;animation:shake .4s}

.check{width:84px;height:84px;margin:0 auto 8px;display:block}

/* Same-screen updates (typing, toggles): calm, animate only what changed. */
#app.still *:not(.hero):not(.fresh):not(.fresh *){animation:none!important}
#app.still .hero{animation:shift 12s ease var(--sd,0s) infinite!important}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ---------- v4: brand text, header icons, snackbar ---------- */
.brand .bt{color:var(--ink)!important}

:root[data-theme="dark"] .brand .bt{color:#fff!important}

.hicon{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;transition:border-color .2s,transform .2s}

.hicon.wl{display:none}
.hicon svg.i{width:19px;height:19px}
.hicon .badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface);line-height:1}
@media (min-width:700px){.hicon.wl{display:grid}}
@media (max-width:699px){.hdr .theme{display:none}}
.bnav .dot{position:absolute;top:9px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#e0485f}
.tbtn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}

.snack{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);width:max-content;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;box-shadow:var(--shadow2)}
.snack.fresh{animation:snackin .35s cubic-bezier(.2,.9,.3,1.2)}
.snack.out{opacity:0;transform:translate(-50%,10px);transition:opacity .25s,transform .25s}
.snack .linkbtn{color:var(--gold);white-space:nowrap}
@media (min-width:700px){.snack{bottom:26px}}
@keyframes snackin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- v4: form fields, inline errors ---------- */
input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:48px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.field .hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.4;display:flex;gap:6px;align-items:center}

.field .ferr{display:flex;gap:6px;align-items:flex-start;color:var(--bad);font-size:13px;font-weight:700;margin:6px 0 0;line-height:1.4}

.sugg{font-size:13px;margin:6px 0 0;color:var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:10px;line-height:1.45}

.sugg b{color:var(--ink)}
.tel{display:flex;gap:8px;align-items:stretch;min-width:0}

.tel input{flex:1 1 auto;min-width:0}
.pw{position:relative}
.pw input{padding-right:50px}
.pwt{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--muted);border-radius:10px;cursor:pointer;display:grid;place-items:center}
.pwt:hover{color:var(--ink);background:var(--soft)}
.err .linkbtn{color:inherit}
.right{display:flex;justify-content:flex-end}
.center{text-align:center}
.cpnlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:6px 2px;align-self:flex-start}
.cpnlink svg.i{width:17px;height:17px}
.cpn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ok-bg);color:var(--ok);font-weight:700;border-color:transparent}

function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i];}for(j=0;j<=n;j++){d[0][j]=j;}for(i=1;i<=m;i++){for(j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));}}return d[m][n];}
function emailFix(e){var m=/^([^@\s]+)@([^@\s]+)$/.exec(String(e||'').trim());if(!m){return '';}var d=m[2].toLowerCase();if(DOMS.indexOf(d)>-1){return '';}var best='',bd=3;DOMS.forEach(function(x){var k=lev(d,x);if(k<bd){bd=k;best=x;}});var fix='';if(best&&bd<=2&&d.length>4){fix=best;}else{var t=d.replace(/\.(con|cmo|vom|xom|comm|coom|ocm)$/,'.com');if(t!==d){fix=t;}}return fix?m[1]+'@'+fix:'';}

function lenText(L){if(L.length===1){return L[0]+' digits';}var run=true;for(var i=1;i<L.length;i++){if(L[i]!==L[i-1]+1){run=false;}}return run?(L[0]+' to '+L[L.length-1]+' digits'):(L.slice(0,-1).join(', ')+' or '+L[L.length-1]+' digits');}
function phoneNorm(cc,v){var r=ccRow(cc);var d=String(v||'').replace(/\D/g,'');var L=r[3];var dc=String(r[2]);if(d.length>L[L.length-1]&&d.indexOf(dc)===0&&L.indexOf(d.length-dc.length)>-1){d=d.slice(dc.length);}if(d.charAt(0)==='0'&&L.indexOf(d.length)<0&&L.indexOf(d.length-1)>-1){d=d.slice(1);}return d;}
function phoneErr(cc,v,req){var r=ccRow(cc);var d=phoneNorm(cc,v);var L=r[3];if(!d){return req?'Please enter your mobile number.':'';}if(L.indexOf(d.length)<0){return 'A mobile number in '+r[1]+' has '+lenText(L)+' after +'+r[2]+'. You typed '+d.length+'.';}if(r[0]==='IN'&&!/^[6-9]/.test(d)){return 'An Indian mobile number starts with 6, 7, 8 or 9.';}return '';}

var DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isoD(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dOf(iso){var p=String(iso).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayLabel(iso){var d=dOf(iso);return DAYN[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function addMin(t,m){var p=t.split(':');var x=(+p[0])*60+(+p[1])+m;return ('0'+Math.floor(x/60)).slice(-2)+':'+('0'+(x%60)).slice(-2);}
function slotsFor(){var out=[];var t=S.debSet.start;while(t<S.debSet.end){out.push(t);t=addMin(t,30);}return out;}
function t12(t){var p=t.split(':');var h=+p[0];return (h%12||12)+':'+p[1]+(h<12?' AM':' PM');}
function slotText(iso,t){return dayLabel(iso)+', '+t12(t)+' to '+t12(addMin(t,30))+' IST';}
var LTZ=(function(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(e){return '';}})();
var ISIST=(LTZ==='Asia/Kolkata'||LTZ==='Asia/Calcutta'||!LTZ);
function tzName(){return (LTZ.split('/').pop()||'your time').replace(/_/g,' ');}
function localOf(iso,t){if(ISIST){return '';}var p=iso.split('-'),q=t.split(':');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],+q[0],+q[1])-330*60000);var s=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(isoD(d)!==iso){s=DAYN[d.getDay()]+' '+s;}return s;}
function debDays(){var out=[];var d=new Date();d.setHours(0,0,0,0);for(var i=1;i<=S.debSet.ahead;i++){var x=new Date(d.getTime());x.setDate(d.getDate()+i);out.push(x);}return out;}
function dayOpen(x){return S.debSet.days.indexOf(x.getDay())>-1;}
function pickIdx(iso,t){for(var i=0;i<S.deb.picks.length;i++){if(S.deb.picks[i].date===iso&&S.deb.picks[i].time===t){return i;}}return -1;}

 var marks={};S.deb.picks.forEach(function(p){marks[p.date]=1;});var fi=isoD(first),la=isoD(last);var h='';
 for(var x=new Date(start.getTime());x<=end;x.setDate(x.getDate()+1)){var iso=isoD(x);var open=iso>=fi&&iso<=la&&dayOpen(x);var sel=S.deb.date===iso;
  h+='<button type="button" class="cday'+(sel?' on':'')+(open?'':' off')+(marks[iso]?' has':'')+'"'+(open?' data-dday="'+iso+'"':' disabled')+' aria-pressed="'+sel+'" aria-label="'+dayLabel(iso)+(open?'':', not available')+'">'+((x.getDate()===1||iso===isoD(start))?'<small>'+MON[x.getMonth()]+'</small>':'')+'<span>'+x.getDate()+'</span></button>';}
 return '<div class="cal"><div class="cal-h">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(n){return '<span>'+n+'</span>';}).join('')+'</div><div class="cal-g">'+h+'</div></div><p class="small" style="margin-top:8px">Open days: '+S.debSet.days.map(function(n){return DAYN[n];}).join(', ')+'. Grey days are closed. A dot means you picked a time that day.</p>';}
function slotsHtml(){var iso=S.deb.date;if(!iso){return '<p class="small">Pick a date first. The times for that day show here.</p>';}var all=slotsFor();
 var groups=[['Morning',function(t){return t<'12:00';}],['Afternoon',function(t){return t>='12:00'&&t<'16:00';}],['Evening',function(t){return t>='16:00';}]];

function amountOf(s){return parseFloat(String(s).replace(/[^0-9.]/g,''))||0;}
function bundleDisc(ids){if(S.mode==='co'){return [];}var out=[];S.bundles.forEach(function(b){if(!b.on){return;}if(b.courses.every(function(id){return ids.indexOf(id)>-1;})){var s=0;b.courses.forEach(function(id){s+=base(C(id))||0;});out.push({b:b,amt:Math.round(s*b.pct)/100});}});return out;}
function volTier(q){var t=null;S.vol.forEach(function(v){if(q>=v.min&&(!t||v.min>t.min)){t=v;}});return t;}
function extraDisc(rows,qty,sub){var lines=[],tot=0;
 if(S.mode==='co'){var t=volTier(qty);if(t){var a=Math.round(sub*t.pct)/100;lines.push(['Volume discount '+t.pct+'% ('+t.min+'+ licences)',a]);tot+=a;}}
 else{bundleDisc(rows.map(function(r){return r.c.id;})).forEach(function(x){lines.push([x.b.name+' saving',x.amt]);tot+=x.amt;});
  if(S.useCredit&&S.credit>0&&S.cur==='inr'){var left=Math.max(0,sub-tot);var cr=Math.min(S.credit,left);if(cr>0){lines.push(['Your credit',cr]);tot+=cr;}}}
 return {lines:lines,total:tot};}
function extraLines(t){return (t.ex&&t.ex.lines.length)?t.ex.lines.map(function(l){return '<div class="r ok"><span>'+esc(l[0])+'</span><span>- '+money(l[1])+'</span></div>';}).join(''):'';}

 return '<p class="volhint">'+ico('info')+'<span>'+(cur?'You get '+cur.pct+'% off for '+cur.min+' or more licences.':'')+(next?(cur?' ':'')+'Add '+(next.min-q)+' more licence'+(next.min-q===1?'':'s')+' to get '+next.pct+'% off.':'')+'</span></p>';}

var baseRender=render;render=function(){var v=S.view;var key=v+'|'+(ID_VIEWS[v]?S.course:'');
 if(key!==S.trackKey){S.trackKey=key;var c=C(S.course);var t;
  if(v==='course'&&c){track('view_item','ViewContent',{item:c.short,value:base(c),currency:S.cur.toUpperCase()});}
  else if(v==='cart'&&S.cart.length){track('view_cart','',{item:S.cart.map(function(id){return C(id).short;}).join(', ')});}
  else if(v==='checkout'){t=totals();track('begin_checkout','InitiateCheckout',{item:t.rows.map(function(r){return r.c.short;}).join(', '),value:t.total,currency:S.cur.toUpperCase()});}

 if(v==='done'){var o=S.orders[S.orders.length-1];if(o&&!o.tracked){o.tracked=true;track('purchase','Purchase',{id:o.id,item:o.items.map(function(it){return C(it.course).short;}).join(', '),value:amountOf(o.paid),currency:o.cur.toUpperCase()});if(!o.existed){track('sign_up','CompleteRegistration',{});}}}

 baseRender();};
